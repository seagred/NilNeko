<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>NilNeko</title>
    <link rel="icon" type="image/png" href="81_20210123192755.png">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #020617, #0f172a);
            font-family: Arial, sans-serif;
            color: #e5e7eb;

            display: flex;
            justify-content: center;
            align-items: flex-start;
            /* 🔧 สำคัญ */
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 40px 20px 60px;
            text-align: center;
        }

        /* ===== Avatar ===== */
        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, .4);
        }

        h1 {
            margin-top: 16px;
            font-size: 32px;
        }

        .tagline {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* ===== Card ===== */
        .card {
            background: rgba(2, 6, 23, .8);
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .4);
        }

        /* ===== Socials ===== */
        .socials {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .socials a {
            width: 46px;
            height: 46px;
            background: #334155;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform .2s, background .2s, box-shadow .2s;
        }

        .socials img {
            width: 22px;
            height: 22px;
            filter: invert(1);
        }

        /* ===== Games Button ===== */
        .games-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 32px auto 0;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #ef4444, #f97316);
            box-shadow: 0 0 20px rgba(239, 68, 68, .6);
            transition: transform .25s ease, box-shadow .25s ease;
        }

        .games-btn:hover {
            transform: translateY(-4px) scale(1.05);
        }

        /* ===== Info ===== */
        .info {
            margin-top: 20px;
            font-size: 14px;
            color: #cbd5f5;
        }

        /* ========================= */
        /* 📱 Mobile */
        @media (max-width: 480px) {
            .avatar {
                width: 120px;
                height: 120px;
            }

            h1 {
                font-size: 24px;
            }

            .games-btn {
                font-size: 16px;
                padding: 12px 22px;
            }
        }

        /* 📺 TV / จอใหญ่ */
        @media (min-width: 1400px) {
            .container {
                max-width: 1100px;
            }

            h1 {
                font-size: 36px;
            }

            .games-btn {
                font-size: 20px;
                padding: 16px 34px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img class="avatar" src="81_20210123192755.png" alt="NilNeko">

        <h1>NilNeko 🐾</h1>
        <div class="tagline">ปีศาจแมวสายสตรีม | Warframe 🎮</div>

        <div class="card">

                ช่องนี้จะสตรีมเกมเป็นหลัก โดยเฉพาะ <b>Warframe</b><br>
                อยากดูแมวเล่นเกมหรือเข้ามาคุยเล่น กดติดตามได้เลยครับ 🐱
            </p>

            <!-- Social Icons -->

                <a data-platform="facebook" href="https://www.facebook.com/DarkNeko000">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v11/icons/facebook.svg">
                </a>
                <a data-platform="twitch" href="https://www.twitch.tv/nilneko">

                </a>
                <a data-platform="youtube" href="https://www.youtube.com/@nilneko6366">

                </a>

                <a data-platform="instagram" href="https://www.instagram.com/nil_neko/">

                <a data-platform="x" href="https://x.com/NilNeko">

        </div>

</body>

</html>
