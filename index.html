<html lang="th">

<head>
    <meta charset="UTF-8">

        rel="stylesheet">

    <style>
        body {
            font-family: 'Anuphan', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #020617, #0f172a);
            color: #e5e7eb;
        }


        .container {
            max-width: 800px;
            margin: auto;
            padding: 40px 20px;
            text-align: center;
        }

        .avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, .4);
        }

        h1 {
            margin-top: 16px;
            font-size: 32px;
        }

        .tagline {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(2, 6, 23, .8);
            border-radius: 16px;
            padding: 24px;
            margin-top: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .4);
        }

        .info {
            margin-top: 20px;
            color: #cbd5f5;
            font-size: 14px;
        }

        /* ===== Social Icons ===== */
        .socials {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .socials a {
            width: 46px;
            height: 46px;
            background: #334155;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform .2s, background .2s;
        }

        .socials a:hover {
            background: #ef4444;
            transform: translateY(-4px);
        }

        .socials img {
            width: 22px;
            height: 22px;
            filter: invert(1);
        }

        .socials a {
            transition: transform .25s, background .25s, box-shadow .25s;
        }

        /* Facebook */
        .socials a[data-platform="facebook"]:hover {
            background: #1877f2;
            box-shadow: 0 0 15px rgba(24, 119, 242, .7);
        }

        /* YouTube */
        .socials a[data-platform="youtube"]:hover {
            background: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, .7);
        }

        /* Twitch */
        .socials a[data-platform="twitch"]:hover {
            background: #9146ff;
            box-shadow: 0 0 15px rgba(145, 70, 255, .7);
        }

        /* TikTok */
        .socials a[data-platform="tiktok"]:hover {
            background: linear-gradient(135deg, #25f4ee, #fe2c55);
            box-shadow: 0 0 15px rgba(254, 44, 85, .7);
        }

        /* Instagram */
        .socials a[data-platform="instagram"]:hover {
            background: linear-gradient(135deg, #f58529, #dd2a7b, #515bd4);
            box-shadow: 0 0 15px rgba(221, 42, 123, .7);
        }

        /* X */
        .socials a[data-platform="x"]:hover {
            background: #000;
            box-shadow: 0 0 15px rgba(255, 255, 255, .4);
        }

        /* Discord */
        .socials a[data-platform="discord"]:hover {
            background: #5865f2;
            box-shadow: 0 0 15px rgba(88, 101, 242, .7);
        }


        .games-btn {
            position: relative;
            overflow: hidden;

            display: inline-flex;
            align-items: center;
            gap: 10px;

            margin-top: 28px;
            padding: 14px 28px;

            font-size: 18px;
            font-weight: bold;
            letter-spacing: .5px;

            color: #fff;
            text-decoration: none;
            border-radius: 999px;

            background: linear-gradient(135deg, #ef4444, #f97316);
            box-shadow:
                0 0 15px rgba(239, 68, 68, .6),
                0 0 40px rgba(249, 115, 22, .3);

            transition: all .25s ease;
        }

        .games-btn::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            background: linear-gradient(135deg, #f87171, #fb923c);
            z-index: -1;
            opacity: .7;
        }

        .games-btn:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow:
                0 0 25px rgba(239, 68, 68, .9),
                0 0 60px rgba(249, 115, 22, .6);
        }

        /* ===== Gallery Grid ===== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            /* 👈 3 รูปต่อแถว */
            gap: 12px;
            margin-top: 30px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: .25s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* ===== Responsive ===== */
        @media (min-width: 768px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
                /* 👈 จอใหญ่เป็น 4 */
            }
        }

        /* ===== Modal ===== */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
        }

        /* ===== Layout ซ้าย-ขวา ===== */
        .layout {
            display: flex;
            gap: 40px;
            width: 100%;
            max-width: 1200px;
            padding: 40px;
        }

        /* ซ้าย */
        .left {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        /* ขวา */
        .right {
            flex: 1.5;
            background: rgba(2, 6, 23, .6);
            padding: 20px;
            border-radius: 16px;

            max-height: 80vh;
            /* 👈 จำกัดความสูง */
            overflow-y: auto;
            /* 👈 เปิด scroll แนวตั้ง */
        }

        /* ซ่อน scrollbar ให้ดูคลีน */
        .right::-webkit-scrollbar {
            width: 6px;
        }

        .right::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 10px;
        }

        .right::-webkit-scrollbar-thumb:hover {
            background: #ef4444;
        }

        /* ปรับ container เดิม */
        .container {
            max-width: 400px;
        }

        /* ===== Gallery ===== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .gallery img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: .25s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        /* ===== Responsive ===== */
        @media (min-width: 768px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 768px) {
            .layout {
                flex-direction: column;
                align-items: center;
            }

            .right {
                width: 100%;
            }
        }

        .img-box {
            width: 100%;
            aspect-ratio: 1/1;
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
        }

        /* overlay กันคลิก */
        .img-box::after {
            content: "";
            position: absolute;
            inset: 0;
        }

        .preview-btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            background: #0f172a;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        .preview-btn:hover {
            transform: scale(1.05);
            background: #21293a;
        }

        /* การ์ด preview */
        .preview-card {
            background: #020617;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .6);
            animation: fadeIn .2s ease;
        }

        .preview-card img {
            width: 120px;
            border-radius: 50%;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        #previewCanvas {
            max-width: 90%;
            max-height: 90%;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    </div>

    <!-- modal -->
    <div id="imgModal" class="modal" onclick="closeModal()">
        <img id="modalImg">
    </div>
    <script>
        function openModal(src) {
            document.getElementById("modalImg").src = src;
            document.getElementById("imgModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("imgModal").style.display = "none";
        }

        document.addEventListener("contextmenu", e => e.preventDefault()); // ปิดคลิกขวา

        document.addEventListener("dragstart", e => e.preventDefault()); // ปิดลากรูป

        const images = ["CT.jpg", "RT.jpg", "UCT.jpg", "SS1.jpg", "SS2.jpg", "SS3.jpg", "SS4.jpg", "SS5.jpg", "SS6.jpg", "SS7.jpg", "SS8.jpg", "SS9.jpg"];

        const gallery = document.getElementById("gallery");

        images.forEach(name => {
            const div = document.createElement("div");
            div.className = "img-box";
            div.style.backgroundImage = `url(images/${name})`;
            div.onclick = () => openModal(`images/${name}`);
            gallery.appendChild(div);
        });

        function openModal(src) {
            const modal = document.getElementById("imgModal");
            const canvas = document.getElementById("modalCanvas");
            const ctx = canvas.getContext("2d");

            const img = new Image();
            img.src = src;

            img.onload = () => {
                const maxWidth = window.innerWidth * 0.9;
                const maxHeight = window.innerHeight * 0.9;

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height *= maxWidth / width;
                    width = maxWidth;
                }

                if (height > maxHeight) {
                    width *= maxHeight / height;
                    height = maxHeight;
                }

                canvas.width = width;
                canvas.height = height;

                ctx.clearRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);

                // =========================
                // 🔥 โลโก้ลายน้ำ (เอียง)
                // =========================
                const logo = new Image();
                logo.src = "images/logo_nilneko.png";

                logo.onload = () => {
                    const size = width / 2;
                    const gap = size * 0.8;

                    ctx.globalAlpha = 0.2;

                    const angle = -Math.PI / 4;

                    for (let y = -height; y < height * 2; y += gap) {
                        for (let x = -width; x < width * 2; x += gap) {

                            ctx.save();

                            ctx.translate(x, y);
                            ctx.rotate(angle);

                            ctx.drawImage(logo, -size / 2, -size / 2, size, size);

                            ctx.restore();
                        }
                    }

                    ctx.globalAlpha = 1;
                };
            };

            modal.style.display = "flex";
        }

        function openPreview() {
            document.getElementById("cardPreview").style.display = "flex";
        }

        function closePreview() {
            document.getElementById("cardPreview").style.display = "none";
        }

        function openPreview() {
            const modal = document.getElementById("cardPreview");
            const canvas = document.getElementById("previewCanvas");
            const ctx = canvas.getContext("2d");

            const img = new Image();
            img.src = "images/p_SS9.png";

            img.onload = () => {
                const maxWidth = window.innerWidth * 0.8;
                const maxHeight = window.innerHeight * 0.8;

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height *= maxWidth / width;
                    width = maxWidth;
                }

                if (height > maxHeight) {
                    width *= maxHeight / height;
                    height = maxHeight;
                }

                canvas.width = width;
                canvas.height = height;

                ctx.drawImage(img, 0, 0, width, height);

                // =========================
                // 🔥 ใส่โลโก้ลายน้ำ
                // =========================
                const logo = new Image();
                logo.src = "images/logo_nilneko.png";

                logo.onload = () => {
                    const size = width / 2;
                    const gap = size * 0.8;

                    ctx.globalAlpha = 0.2;

                    const angle = -Math.PI / 4;

                    for (let y = -height; y < height * 2; y += gap) {
                        for (let x = -width; x < width * 2; x += gap) {

                            ctx.save();

                            ctx.translate(x, y);
                            ctx.rotate(angle);

                            ctx.drawImage(logo, -size / 2, -size / 2, size, size);

                            ctx.restore();
                        }
                    }

                    ctx.globalAlpha = 1;
                };
            };

            modal.style.display = "flex";
        }

        function closePreview() {
            document.getElementById("cardPreview").style.display = "none";
        }
    </script>
</body>
