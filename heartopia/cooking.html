            padding: 32px;
        }

        h1 {
            text-align: center;
            margin-bottom: 32px;
            color: #5a3e2b;
        }

        .search-box {
            max-width: 360px;
            margin: 0 auto 32px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
            outline: none;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .card {
            background: #fffaf3;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .item-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .item-header img {
            max-width: 56px;
            max-height: 56px;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #6b4226;
        }

        .ingredients {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .ing {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f8e8c8;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 13px;
        }

        .ing img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block;
        }

        .ing-multi {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .level {
            font-size: 13px;
            color: #888;
        }

        .energy {
            font-size: 13px;
            font-weight: bold;
            color: #2f9e44;
        }

        .cost {
            font-size: 13px;
            font-weight: bold;
            color: #e03131;
            margin-bottom: 6px;
        }

        .prices {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            text-align: center;
        }

        .price {
            background: #f3d7a6;
            border-radius: 10px;
            padding: 6px 0;
            font-size: 13px;
        }

        .star {
            display: block;
            color: #f5b301;
        }

        .info-note {
            max-width: 640px;
            margin: 12px auto 28px;
            padding: 10px 14px;
            font-size: 13px;
            color: #7a5a3a;
            background: #fff6df;
            border-radius: 12px;
            text-align: center;
            line-height: 1.4;
            box-shadow: 0 2px 6px rgba(0, 0, 0, .06);
        }

        .filter-box {
            display: flex;
            justify-content: center;
            margin: -16px 0 28px;
        }

        .filter-box select {
            max-width: 180px;
            padding: 10px 14px;
            border-radius: 14px;
            border: none;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, .12);
            background: #fffaf3;
            color: #5a3e2b;
        }
    </style>
</head>

        const container = document.getElementById("recipes");

        function formatNumber(n) {
            return Number(n).toLocaleString("th-TH");
        }

        function render(list) {
            container.innerHTML = list.map(r => `
        <div class="card">
          <div class="item-header">
            <img src="${r.img}">
            <div class="item-name">${r.name}</div>
          </div>

          <div class="ingredients">
            ${r.ingredients.map(i => `
              <div class="ing">
                ${i.imgs
                    ? `<div class="ing-multi">
                      ${i.imgs.map(img =>
                        `<img src="${img}" title="${getIngName(img)}">`
                    ).join("")}
                    </div>`
                    : i.img
                        ? `<img src="${i.img}" title="${getIngName(i.img)}">`
                        : i.emoji || ""
                }
                <span>x${i.qty}</span>
                ${i.label ? `<small>(${i.label})</small>` : ""}
              </div>
            `).join("")}
          </div>

          <div class="level">ต้องการเลเวลคราฟ: ${r.level}</div>
          <div class="energy">⚡ Energy +${r.energy}</div>
          <div class="cost">
        💰 ต้นทุน ${formatNumber(r.cost)}
        ${r.costFrom ? `<span style="opacity:.7"> (${r.costFrom})</span>` : ""}
        </div>

          <div class="prices">
            ${multipliers.map((m, i) => `
              <div class="price">
                <span class="star">★${i + 1}</span>
                ${formatNumber(Math.round(r.base * m))}
              </div>
            `).join("")}
          </div>
        </div>
      `).join("");
        }

        render(recipes);

        const searchInput = document.getElementById("search");

        searchInput.addEventListener("input", () => {
            const q = searchInput.value.trim().toLowerCase();

            // ✅ ถ้าว่าง → แสดงทั้งหมดแล้วหยุด
            if (!q) {
                render(recipes);
                return;
            }

            const filtered = recipes.filter(r => {
                // ชื่ออาหาร
                if (r.name.toLowerCase().includes(q)) return true;

                // วัตถุดิบ
                return r.ingredients.some(i => {
                    if (i.img) {
                        return getIngName(i.img).toLowerCase().includes(q);
                    }
                    if (i.imgs) {
                        return i.imgs.some(img =>
                            getIngName(img).toLowerCase().includes(q)
                        );
                    }
                    if (i.emoji) {
                        return i.emoji.includes(q);
                    }
                    return false;
                });
            });

            render(filtered);
        });

        const sortSelect = document.getElementById("sort");

        function applyFilter() {
            const q = searchInput.value.trim().toLowerCase();
            let list = [...recipes];

            // 🔍 search
            if (q) {
                list = list.filter(r => {
                    if (r.name.toLowerCase().includes(q)) return true;
                    return r.ingredients.some(i => {
                        if (i.img) return getIngName(i.img).toLowerCase().includes(q);
                        if (i.imgs) return i.imgs.some(img =>
                            getIngName(img).toLowerCase().includes(q)
                        );
                        if (i.emoji) return i.emoji.includes(q);
                        return false;
                    });
                });
            }

            // 🔽 sort
            switch (sortSelect.value) {
                case "sell-desc":
                    list.sort((a, b) => b.base - a.base);
                    break;
                case "sell-asc":
                    list.sort((a, b) => a.base - b.base);
                    break;
                case "cost-asc":
                    list.sort((a, b) => a.cost - b.cost);
                    break;
                case "cost-desc":
                    list.sort((a, b) => b.cost - a.cost);
                    break;
            }

            render(list);
        }

        searchInput.addEventListener("input", applyFilter);
        sortSelect.addEventListener("change", applyFilter);
    </script>
