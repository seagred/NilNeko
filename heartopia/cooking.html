<!DOCTYPE html>

<head>
    <meta charset="UTF-8" />
    <title>Heartopia Recipes</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(180deg, #f7efe5, #efe3d3);
            padding: 32px;
        }

        h1 {
            text-align: center;
            margin-bottom: 32px;
            color: #5a3e2b;
        }

        .search-box {
            max-width: 360px;
            margin: 0 auto 32px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
            outline: none;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .card {
            background: #fffaf3;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .item-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 12px;
        }

        .item-header img {
            max-width: 56px;
            max-height: 56px;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .item-name {
            font-size: 18px;
            font-weight: bold;
            color: #6b4226;
        }

        .ingredients {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .ing {
            display: flex;
            align-items: center;
            gap: 4px;
            background: #f8e8c8;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 13px;
        }

        .ing img {
            width: 20px;
            height: 20px;
        }

        .ing-multi {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .level {
            font-size: 13px;
            color: #888;
        }

        .energy {
            font-size: 13px;
            font-weight: bold;
            color: #2f9e44;
        }

        .cost {
            font-size: 13px;
            font-weight: bold;
            color: #e03131;
            margin-bottom: 6px;
        }

        .prices {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            text-align: center;
        }

        .price {
            background: #f3d7a6;
            border-radius: 10px;
            padding: 6px 0;
            font-size: 13px;
        }

        .star {
            display: block;
            color: #f5b301;
        }
    </style>
</head>
