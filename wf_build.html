<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <title>Warframe Builds</title>
  <link rel="icon" type="image/png" href="81_20210123192755.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 12px;
    }

    /* ===== Search ===== */
    .search-box {
      max-width: 400px;
      margin: 0 auto 20px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      outline: none;
      background: #020617;
      color: #e5e7eb;
      font-size: 14px;
    }

    /* ===== Grid 2–3 แถว ===== */
    .characters {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 14px;
      max-width: 1000px;
      margin: auto;
    }

    /* ===== Card ===== */
    .char-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #334155;
      border-radius: 12px;
      padding: 6px;
      cursor: pointer;
      transition: transform .2s, background .2s;
    }

    .char-btn:hover {
      transform: translateY(-4px);
      background: #475569;
    }

    /* ไม่มี Build */
    .char-btn.disabled {
      background: #1f2933;
      filter: grayscale(100%);
      opacity: 0.6;
    }

    .char-btn.disabled:hover {
      transform: none;
      background: #1f2933;
    }

    /* ===== รูป ===== */
    .img-box {
      width: 40px;
      height: 40px;
      position: relative;
      margin-bottom: 4px;
    }

    .img-box img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      transition: opacity .25s ease;
    }

    .img-box img.prime {
      opacity: 0;
    }

    .char-btn:hover img.normal {
      opacity: 0;
    }

    .char-btn:hover img.prime {
      opacity: 1;
    }

    .char-btn span {
      font-size: 12px;
      text-align: center;
    }

    /* ===== Build Card ===== */
    .card {
      max-width: 1000px;
      margin: 30px auto;
      padding: 16px;
      border-radius: 12px;
      background: #020617;
      border-left: 6px solid #38bdf8;
    }

    .no-build {
      color: #f87171;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 600px;
      margin-top: 12px;
      border-radius: 8px;
      border: none;
    }
  </style>
</head>

    const container = document.getElementById("characters");
    const buildBox = document.getElementById("build");
    const title = document.getElementById("title");

    // แสดงจำนวนตัวละคร
    title.innerText = `Warframe Builds (${warframes.length})`;

    // เรียงชื่อ
    warframes.sort((a, b) => a.name.localeCompare(b.name, "en"));

    // ฟังก์ชันแปลงลิงก์ YouTube เป็น embed
    function toEmbed(url) {
      // จับ VIDEO_ID จากลิงก์
      const reg = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/;
      const match = url.match(reg);
      if (match && match[1]) {
        return `https://www.youtube.com/embed/${match[1]}`;
      }
      return url; // คืนค่าเดิมถ้าไม่ตรง pattern
    }

    // Render ตัวละคร
    warframes.forEach(wf => {
      const btn = document.createElement("div");
      btn.className = "char-btn";

      if (!wf.video && (!wf.videos || wf.videos.length === 0)) btn.classList.add("disabled");

      btn.innerHTML = `
    <div class="img-box">
      <img class="normal" src="${wf.normal}">
      ${wf.prime ? `<img class="prime" src="${wf.prime}">` : ""}
    </div>
    <span>${wf.name}</span>
  `;

      btn.onclick = () => showBuild(wf);

      container.appendChild(btn);
    });

    // แสดง Build + Video
    function showBuild(wf) {
      buildBox.innerHTML = `
    <h2>${wf.name} Build</h2>
    <p>${wf.desc || ""}</p>
    <div id="videoBox"></div>
  `;

      const videoBox = document.getElementById("videoBox");

      // วิดีโอหลายอัน
      if (wf.videos && wf.videos.length > 0) {
        wf.videos.forEach(url => {
          const iframe = document.createElement("iframe");
          iframe.src = toEmbed(url);
          iframe.allowFullscreen = true;
          iframe.loading = "lazy";
          videoBox.appendChild(iframe);
        });
      }
      // วิดีโอเดี่ยว
      else if (wf.video) {
        const iframe = document.createElement("iframe");
        iframe.src = toEmbed(wf.video);
        iframe.allowFullscreen = true;
        iframe.loading = "lazy";
        videoBox.appendChild(iframe);
      }
      // ไม่มีวิดีโอ
      else {
        videoBox.innerHTML = `<p class="no-build">⛔ ยังไม่มี Build สำหรับตัวนี้</p>`;
      }

      buildBox.scrollIntoView({ behavior: "smooth" });
    }


  </script>
