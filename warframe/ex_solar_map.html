            background: #050914;
            overflow: hidden;
            color: white;
        }

        /* background */

        body::before {
            content: "";
            position: fixed;
            width: 100%;
            height: 100%;
            background: url("./img_nilneko.png");
            background-size: cover;
            background-position: center;
            opacity: 0.35;
            filter: blur(10px);
        }

        /* MAP */

            position: absolute;
            top: 30%;
            left: 45%;
            transform: translate(-50%, -50%) scale(1.8);
            width: 1600px;
            height: 900px;
        }

        /* PLANET */

        .planet {
            position: absolute;
            width: 70px;
            height: 70px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            cursor: pointer;
            transition: none;
        }

        .planet:hover {
            transform: scale(1.08);
            filter:

        }

        .small {
            width: 40px;
            height: 40px;
        }

        .label {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 6px;
            font-size: 13px;
            color: #cfe6ff;
            text-shadow: 0 0 8px black;
            white-space: nowrap;
        }

        /* TOP RIGHT UI */

            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 999;
        }

        .topUI img {

            width: 200px;
            cursor: pointer;
            transition: .2s;
        }

        .topUI img:hover {

            transform: scale(1.08);

            filter:
                drop-shadow(0 0 10px #ffffff) drop-shadow(0 0 25px #ffffff);
        }

        /* PANEL */

            display: none;

            right: 20px;

            border: 1px solid #294b8f;

            padding: 15px;

            overflow-y: auto;

        }

            background: #2f5bbd;
            border-radius: 4px;
        }

        }

            from {
                opacity: 0;
                transform: translateY(-10px);
            }

                transform: translateY(0);
            }

            height: 48px;

            border-radius: 6px;
            cursor: pointer;

            background: #0f1b36;

            gap: 14px;
            margin-top: 8px;

            padding: 8px;

            border-radius: 8px;

            padding: 14px;

        function getNextReset() {

            const now = new Date()

            let next = new Date(now)

            let day = now.getDay()
            let diff = (8 - day) % 7

            next.setDate(now.getDate() + diff)

            next.setHours(7, 0, 0, 0)

            if (diff === 0 && now >= next) {
                next.setDate(next.getDate() + 7)
            }

            return next
        }

        function updateTimer() {

            const now = new Date()
            const reset = getNextReset()

            const diff = reset - now

            const d = Math.floor(diff / (1000 * 60 * 60 * 24))
            const h = Math.floor(diff / (1000 * 60 * 60) % 24)
            const m = Math.floor(diff / (1000 * 60) % 60)
            const s = Math.floor(diff / 1000 % 60)

            const el = document.getElementById("resetTimer")
            if (!el) return

            el.innerText = `(Reset in ${d}d ${h}h ${m}m ${s}s)`
        }

        setInterval(updateTimer, 1000)
        updateTimer()

        /* ---------------- CURRENT WEEK ---------------- */

        function getCurrentWeek(startDate, totalWeeks) {

            const start = new Date(startDate)
            const now = new Date()

            const diff = now - start

            const week = Math.floor(diff / (1000 * 60 * 60 * 24 * 7))

            return ((week % totalWeeks) + totalWeeks) % totalWeeks
        }

        let currentMode = "normal"

        /* ---------------- PANEL RENDER ---------------- */

        function showMode(mode) {

            currentMode = mode

            document.querySelectorAll(".tab").forEach(t => {
                t.classList.remove("active")
            })

            if (mode === "normal") {
                document.querySelectorAll(".tab")[0].classList.add("active")
            } else {
                document.querySelectorAll(".tab")[1].classList.add("active")
            }

            let source = mode === "normal" ? normalWeeks : spWeeks

            /* Week1 start date */
            let startDate = mode === "normal"
                ? "2026-01-26T07:00:00+07:00"
                : "2026-03-02T07:00:00+07:00"

            let w = getCurrentWeek(startDate, source.length)

            let html = ""

            for (let i = 0; i < source.length; i++) {

                let index = (w + i) % source.length
                let data = source[index]

                html += `<div class="week ${i == 0 ? 'current' : ''}">
<b>
${i == 0
                        ? `Current Week <span id="resetTimer"></span>`
                        : 'Week ' + (index + 1)}
</b>
<div class="rotation">`

</div>`

                })

                html += `</div></div>`
            }

            document.getElementById("content").innerHTML = html
        }
