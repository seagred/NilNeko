<html lang="th">

    <title>Warframe Solar Map</title>
    <link rel="icon" type="image/png" href="../81_20210123192755.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        body {
            font-family: 'Anuphan', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at top, #0f172a, #020617);
            color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #9ad1ff;
        }

        /* GRID */
        .characters {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 14px;
            max-width: 1000px;
            margin: auto;
        }

        .char-btn {
            text-align: center;
            padding: 10px;
            background: #1e293b;
            border-radius: 12px;
            cursor: pointer;
            transition: .25s;
        }

        .char-btn:hover {
            background: #334155;
            transform: translateY(-5px) scale(1.05);
        }

        .char-btn img {
            width: 50px;
        }

        /* CARD */
        .farm-card {
            max-width: 550px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;

            background: transparent;
            border: 1px solid #3f78ff;
            border-radius: 12px;
            padding: 16px;

            transition: .25s;
        }

        .farm-card:hover {
            box-shadow: 0 0 15px rgba(63, 120, 255, 0.3);
        }

        .farm-left {
            display: flex;
            gap: 14px;
        }

        .farm-card img.wf {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(96, 165, 250, 0.5));
        }

        .farm-node {
            color: #facc15;
            font-weight: 600;
        }

        .drop {
            display: grid;
            grid-template-columns: 170px 1fr;
            margin-top: 6px;
            font-size: 14px;
        }

        .drop span:last-child {
            color: #7dd3fc;
        }

        /* PLANET */
        .planet-big {
            text-align: center;
        }

        .planet-big img {
            width: 130px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px #60a5fa);
        }

        .planet-big span {
            display: block;
            margin-top: 6px;
            font-weight: bold;
            color: #93c5fd;
        }

        /* POPUP */
        .popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);

            justify-content: center;
            align-items: center;
        }

        .popup.show {
            display: flex;
            /* 🔥 เปิด popup */
        }

        .popup-content {
            width: 600px;
            animation: popupIn 0.25s ease;
        }

        /* ปุ่ม */
        .popup-footer {
            text-align: center;
            margin-top: 20px;
        }

        .close-btn {
            padding: 10px 30px;
            background: transparent;
            color: #9ad1ff;
            border: 1px solid #3f78ff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: .25s;
        }

        .close-btn:hover {
            background: #3f78ff;
            color: white;
            box-shadow: 0 0 12px rgba(63, 120, 255, 0.6);
        }

        .planet-th {
            font-size: 16px;
            font-weight: bold;
            color: #93c5fd;
        }

        .planet-en {
            font-size: 12px;
            opacity: .6;
        }

        .boss-text {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px
        }

        /* ===== TYPE BADGE ===== */
        .farm-type {
            display: inline-block;
            font-size: 12px;
            padding: 2px 10px;
            border-radius: 999px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        /* แยกสีแต่ละประเภท */
        .type-boss {
            background: #7f1d1d;
            margin-top: 10px;
            color: #fecaca;
        }

        .type-bounty {
            background: #1e3a8a;
            margin-top: 10px;
            color: #bfdbfe;
        }

        .type-vendor {
            background: #064e3b;
            margin-top: 10px;
            color: #a7f3d0;
        }

        .type-mission {
            background: #1e40af;
            margin-top: 10px;
            color: #93c5fd;
        }

        .type-quest {
            background: #7c3aed;
            margin-top: 10px;
            color: #dbbbfc;
        }

        /* ===== SECTION BOX ===== */
        .info-box {
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 8px;
            background: #020617;
            border: 1px solid #1e40af;
        }

        /* ===== ICON TEXT ===== */
        .info-line {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
            gap: 10px;
            /* 🔥 เพิ่ม */
        }

        .info-line span:first-child {
            opacity: 0.6;
            flex-shrink: 0;
            /* 🔥 กันคำว่า Trade ยุบ */
        }

        .info-line span:last-child {
            text-align: right;
            word-break: break-word;
            /* 🔥 ตัดคำ */
            overflow-wrap: anywhere;
            /* 🔥 กันล้นโหด ๆ */
        }

        /* ===== BOUNTY TAG ===== */
        .bounty-source {
            font-weight: bold;
            color: #93c5fd;
        }

        /* ===== VENDOR STYLE ===== */
        .vendor-name {
            font-weight: bold;
            color: #4ade80;
        }

        /* ===== Search ===== */
        .search-box {
            max-width: 400px;
            margin: 0 auto 20px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 999px;
            border: none;
            outline: none;
            background: #020617;
            color: #e5e7eb;
            font-size: 14px;
        }

        .topUI {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .topUI img {
            width: 120px;
            border-radius: 10px;
            cursor: pointer;
            transition: .2s;
        }

        .topUI img:hover {
            transform: scale(1.1);
        }

        /* PANEL */
        .panel {
            display: none;
            max-width: 800px;
            margin: 20px auto;
            background: #020617;
            border: 1px solid #3f78ff;
            border-radius: 12px;
            padding: 16px;
        }

        .panel.show {
            display: block;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .tab {
            padding: 6px 14px;
            border-radius: 8px;
            background: #1e293b;
            cursor: pointer;
        }

        .tab.active {
            background: #3f78ff;
        }

        /* TOP RIGHT UI */

        .topUI {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 999;
        }

        .topUI img {
            width: 200px;
            cursor: pointer;
            transition: .2s;
        }

        .topUI img:hover {
            transform: scale(1.08);
            filter:
                drop-shadow(0 0 10px #ffffff) drop-shadow(0 0 25px #ffffff);
        }

        /* PANEL */

        .panel {
            position: fixed;
            display: none;
            top: 160px;
            right: 20px;
            width: auto;
            max-height: 600px;
            /* จำกัดความสูง */

            background: #0b1324;
            border: 1px solid #294b8f;
            border-radius: 10px;
            padding: 15px;

            box-shadow: 0 0 25px #000;

            overflow-y: auto;
            /* ทำให้ scroll ได้ */

        }

        .panel::-webkit-scrollbar {
            width: 6px;
        }

        .panel::-webkit-scrollbar-track {
            background: #0b1324;
        }

        .panel::-webkit-scrollbar-thumb {
            background: #2f5bbd;
            border-radius: 4px;
        }

        #planetPanel {
            z-index: 1000;
        }

        @keyframes drop {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rotation {

            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
        }

        .frame img {
            width: 48px;
            height: 48px;
        }

        .weapon {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
        }

        .weapon img {
            width: 48px;
            height: 48px;
        }

            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .tab {
            padding: 6px 12px;
            background: #132248;
            border-radius: 6px;
            cursor: pointer;
        }

        .tab.active {
            background: #000000;
        }

        .week {
            margin-bottom: 10px;
            padding: 10px;
            background: #0f1b36;
            border-radius: 6px;
        }

        .current {
            border: 1px solid #ffffff;
        }

        .rotation {
            display: flex;
            gap: 14px;
            margin-top: 8px;
        }

        .frameCard {

            display: flex;
            flex-direction: column;
            align-items: center;

            width: 90px;
            padding: 8px;

            background: #0e1a36;

            border-radius: 8px;

            border: 1px solid #2f5bbd;

            box-shadow:

            transition: .2s;
        }

        .frameCard:hover {

            transform: scale(1.08);

            border: 1px solid #5fa8ff;

            box-shadow:
                0 0 10px #5fa8ff,
                0 0 25px rgba(0, 0, 0, .6);

        }

        .frameCard img {

            width: 64px;
            height: 64px;

            object-fit: contain;
        }

        .current {

            border: 2px solid #00e1ff;

            box-shadow:
                0 0 10px #00e1ff,
                0 0 25px rgba(0, 0, 0, .6);

            background: #142a5c;

        }

        #resetTimer {
            color: #00eaff;
            font-size: 16px;
            margin-left: 6px;
            text-shadow: 0 0 8px #00eaff;
        }

        .mood-box {
            position: relative;
            text-align: center;
            padding: 60px 30px;
            border-radius: 20px;

            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.02));

            backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 255, 0.15);

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5),
                inset 0 0 40px rgba(255, 255, 255, 0.03);
            width: 100%;
            margin: 0 auto;
            box-sizing: border-box;
            overflow: hidden;
        }

        .mood-title {
            font-size: 28px;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .mood-name {
            font-size: 72px;
            font-weight: 700;

            background: linear-gradient(180deg, #a7f3d0, #5eead4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mood-timer {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.6;
        }

        .mood-next {
            margin-top: 50px;
            text-align: left;
        }

        .mood-next h3 {
            text-align: center;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .mood-next table {
            width: 100%;
            border-collapse: collapse;
        }

        .mood-next th {
            text-align: left;
            opacity: .7;
            border-bottom: 1px solid #555;
            padding-bottom: 6px;
        }

        .mood-next td {
            padding: 6px 0;
            border-bottom: 1px solid #333;
        }

        .next-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;

            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .next-item span:last-child {
            opacity: 0.6;
        }

        .kullervo-sword {
            position: absolute;
            top: 30%;
            left: 50%;

            width: 180px;
            opacity: 0.25;
            pointer-events: none;

            transform: translate(-50%, -50%) rotate(-15deg);
        }

        /* 🔥 Anger */
        .kullervo-sword.anger {
            filter: drop-shadow(0 0 25px red);
        }

        /* 😱 Fear */
        .kullervo-sword.fear {
            filter: drop-shadow(0 0 25px purple);
        }

        /* 😢 Sorrow */
        .kullervo-sword.sorrow {
            filter: drop-shadow(0 0 25px cyan);
        }

        .char-btn.no-data {
            background: #111827;
            opacity: 0.4;
            filter: grayscale(100%);
            cursor: default;
        }

        .char-btn.no-data:hover {
            transform: none;
            background: #111827;
        }

        /* ANIMATION */
        @keyframes popupIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }
    </style>
</head>

        function renderCharacters(list) {
            container.innerHTML = "" // ล้างก่อน

            list.forEach(wf => {
                const div = document.createElement("div")

                const hasData = farmData[wf.name] // 🔥 เช็คว่ามีข้อมูลไหม

                div.className = "char-btn" + (hasData ? "" : " no-data")

                div.innerHTML = `
            <img src="${wf.normal}" data-normal="${wf.normal}" data-prime="${wf.prime}">
            <div>${wf.name}</div>
        `

                const img = div.querySelector("img")

                // hover เฉพาะตัวที่มีข้อมูล + มี prime
                if (wf.prime && hasData) {
                    div.addEventListener("mouseenter", () => {
                        img.src = img.dataset.prime
                    })

                    div.addEventListener("mouseleave", () => {
                        img.src = img.dataset.normal
                    })
                }

                // คลิกได้เฉพาะตัวที่มีข้อมูล
                if (hasData) {
                    div.onclick = () => showFarm(wf)
                } else {
                    div.title = "ยังไม่มีข้อมูล" // 🔥 tooltip
                }

                container.appendChild(div)
            })
        }

        // 🔍 ค้นหาแล้วกรอง
        searchInput.addEventListener("input", () => {
            const keyword = searchInput.value.toLowerCase();

            const filtered = warframes.filter(wf =>
                wf.name.toLowerCase().includes(keyword)
            );

            renderCharacters(filtered);
        });

        function showFarm(wf) {

            const popup = document.getElementById("popup")
            const body = document.getElementById("popup-body")

            const sources = farmData[wf.name]

            // ❌ ไม่มีข้อมูล
            if (!sources) {
                body.innerHTML = `
        <div style="text-align:center;">❌ ไม่มีข้อมูล</div>
        <div class="popup-footer">
            <button class="close-btn" onclick="closePopup()">ปิด</button>
        </div>
        `
                popup.classList.add("show")
                return
            }

            let html = ""

            sources.forEach(f => {

                /* ===== TYPE ===== */
                let typeLabel = ""
                let typeClass = ""

                if (f.type === "boss") {
                    typeLabel = "👹 Boss Drop"
                    typeClass = "type-boss"
                }
                else if (f.type === "bounty") {
                    typeLabel = "🌍 Bounty"
                    typeClass = "type-bounty"
                }
                else if (f.type === "vendor") {
                    typeLabel = "🛒 Vendor"
                    typeClass = "type-vendor"
                }
                else if (f.type === "mission") {
                    typeLabel = "⚔️ Mission"
                    typeClass = "type-mission"
                }

                else if (f.type === "quest") {
                    typeLabel = "📜 Quest"
                    typeClass = "type-quest"
                }

                /* ===== DROPS ===== */
                let dropsHTML = ""

                // blueprint แยก
                if (f.blueprint) {
                    dropsHTML += `
            <div class="drop">
                <span>Blueprint</span>
                <span>${f.blueprint}</span>
            </div>`
                }

                // drops list
                if (Array.isArray(f.drops)) {
                    f.drops.forEach(d => {
                        dropsHTML += `
                <div class="drop">
                    <span>${d.item}</span>
                    <span>${d.chance}</span>
                </div>`
                    })
                }

        function getNextReset() {

            const now = new Date()

            let next = new Date(now)

            let day = now.getDay()
            let diff = (8 - day) % 7

            next.setDate(now.getDate() + diff)

            next.setHours(7, 0, 0, 0)

            if (diff === 0 && now >= next) {
                next.setDate(next.getDate() + 7)
            }

            return next
        }

        function updateTimer() {

            const now = new Date()
            const reset = getNextReset()

            const diff = reset - now

            const d = Math.floor(diff / (1000 * 60 * 60 * 24))
            const h = Math.floor(diff / (1000 * 60 * 60) % 24)
            const m = Math.floor(diff / (1000 * 60) % 60)
            const s = Math.floor(diff / 1000 % 60)

            const el = document.getElementById("resetTimer")
            if (!el) return

            el.innerText = `(Reset in ${d}d ${h}h ${m}m ${s}s)`
        }

        setInterval(updateTimer, 1000)
        updateTimer()

        /* ---------------- CURRENT WEEK ---------------- */

        function getCurrentWeek(startDate, totalWeeks) {

            const start = new Date(startDate)
            const now = new Date()

            const diff = now - start

            const week = Math.floor(diff / (1000 * 60 * 60 * 24 * 7))

            return ((week % totalWeeks) + totalWeeks) % totalWeeks
        }

            { name: "Envy", th: "อิจฉา", color: "#60a5fa" },

        // 🔥 ปรับครั้งเดียวให้ตรง (สำคัญ)
        const OFFSET = 1;

        function getCurrentMood() {

            const now = new Date();

            // ใช้ UTC เพื่อให้ตรง global
            const utcHour = now.getUTCHours();

            // ทุก 2 ชั่วโมง = 1 mood
            const cycle = Math.floor(utcHour / 2);

            return (cycle + OFFSET) % moods.length;
        }

        function getMoodRotation() {

            const now = new Date();

            const utcHour = now.getUTCHours();
            const cycle = Math.floor(utcHour / 2);

            const currentIndex = (cycle + OFFSET) % moods.length;

            // 🔥 หา reset ถัดไป (ทุก 2 ชม UTC)
            const nextReset = new Date(now);
            nextReset.setUTCMinutes(0, 0, 0);

            const h = nextReset.getUTCHours();

            if (h % 2 === 0) {
                nextReset.setUTCHours(h + 2);
            } else {
                nextReset.setUTCHours(h + 1);
            }

            let list = [];

            for (let i = 1; i <= 3; i++) {

                const index = (currentIndex + i) % moods.length;

                const time = new Date(nextReset);
                time.setUTCHours(nextReset.getUTCHours() + ((i - 1) * 2));

                list.push({
                    name: moods[index].name,
                    time: time
                });
            }

            return {
                current: moods[currentIndex],
                next: list,
                nextReset
            };
        }
